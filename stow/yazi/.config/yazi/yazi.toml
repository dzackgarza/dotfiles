# Mimics ~/.config/ranger/rc.conf (2026-05-09 revision) and rifle.conf
# Docs: https://yazi-rs.github.io/docs/configuration/yazi

[mgr]
ratio          = [ 1, 3, 4 ]
sort_by        = "natural"
sort_sensitive = false
sort_dir_first = true
scrolloff      = 8
show_hidden    = true

[opener]
zathura = [
	{ run = 'zathura %s', desc = "Open with zathura", orphan = true },
]
imv = [
	{ run = 'imv %s', desc = "Open with imv", orphan = true },
]
mpv = [
	{ run = 'mpv %s', desc = "Open with mpv", orphan = true },
]
mpv-term = [
	{ run = 'mpv %s', desc = "Open with mpv (in terminal)", block = true },
]

[open]
prepend_rules = [
	{ mime = "application/pdf", use = "zathura" },
	{ mime = "image/*",         use = "imv" },
	{ mime = "video/*",         use = "mpv" },
	{ mime = "audio/*",         use = "mpv-term" },
	{ url = "*.npy",            use = "edit" },
]

[plugin]
prepend_previewers = [
	{ url = "*.sage", run = "sage" },
	{ url = "*.spyx", run = "sage" },
	{ url = "*.ipynb", run = "ipynb" },
	{ url = "*.{db,sqlite,sqlite3}", run = "sqlite" },
	{ url = "*.npy", run = "npy" },
	{ url = "*.{g,gd,gi,gap}", run = "gap" },
]
