# Drop-in for hyprland-session.target: start PDF Bucket's XDG autostart entry with the Hyprland
# session. systemd-xdg-autostart-generator(8) turns ~/.config/autostart/pdf-bucket-desktop.desktop
# into this unit; wanting the one unit, instead of xdg-desktop-autostart.target, leaves every
# other autostart entry on this machine as it is.
[Unit]
Wants=app-pdf\x2dbucket\x2ddesktop@autostart.service
