include ~/.config/kitty/current-theme.conf

font_family JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
cursor_shape block
cursor_trail 1

font_size 10.0

initial_window_width 95c
initial_window_height 35c
remember_window_size no


# window
window_padding_width 5
window_margin_width 5
window_border_width 2px
active_border_color #b4b9bc
inactive_border_color #928C7A
enabled_layouts Tall, *
confirm_os_window_close 0

map kitty_mod+j third_window
map kitty_mod+l second_window
map kitty_mod+h first_window
map ctrl+shift+[ next_window

url_hover_cursor_pointer yes


background_opacity 0.95        
background_blur    4           
dynamic_background_opacity yes 
disable_ligatures never
shell_integration enabled
confirm_os_window_close 0

map shift+enter send_text all \x1b\r
