[Commands]
1\Command="\nconst onItemsAdded_ = onItemsAdded;\n\nfunction clippedText(s, max) {\n    s = String(s || '');\n    s = s.replace(/[\\r\\n\\t]+/g, ' ');\n    s = s.replace(/  +/g, ' ');\n    s = s.trim();\n\n    if (s.length > max)\n        s = s.slice(0, max - 1) + '…';\n\n    return s;\n}\n\nfunction itemPreview(item) {\n    if (item && item[mimeText])\n        return clippedText(str(item[mimeText]), 80);\n\n    if (item && item[mimeUriList])\n        return clippedText(str(item[mimeUriList]), 80);\n\n    return '[non-text clipboard item]';\n}\n\nonItemsAdded = function() {\n    const result = onItemsAdded_();\n\n    const items = selectedItemsData();\n    const preview = items.length > 0\n        ? itemPreview(items[0])\n        : '[clipboard item saved]';\n\n    execute(\n        'hyprctl', 'notify',\n        '5',\n        '1200',\n        'rgb(89b4fa)',\n        'Copied: ' + preview\n    );\n\n    return result;\n};\n"
1\IsScript=true
1\Name=Hyprland Notify on Item Added
